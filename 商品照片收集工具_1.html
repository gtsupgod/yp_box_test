<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>商品照片收集 → 自動產生 Word</title>
<style>
  :root{
    --bg:#1e1e2e;
    --card:#2a2a3c;
    --card-done:#25334a;
    --accent:#4fc3f7;
    --accent-dark:#2196c9;
    --text:#e6e6e6;
    --text-dim:#9a9ab0;
    --danger:#ff6b6b;
    --ok:#5ee38c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Microsoft JhengHei UI","Microsoft JhengHei",-apple-system,sans-serif;
    padding-bottom:100px;
  }
  header{
    padding:16px 16px 10px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
    border-bottom:1px solid #3a3a52;
  }
  h1{
    font-size:18px;
    margin:0 0 10px;
    color:var(--accent);
  }
  .product-input{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid #3a3a52;
    background:#16161f;
    color:var(--text);
    font-size:15px;
  }
  .version-tag{
    display:inline-block;
    font-size:11px;
    color:var(--text-dim);
    background:#16161f;
    border:1px solid #3a3a52;
    border-radius:6px;
    padding:2px 8px;
    margin-bottom:8px;
  }
  .progress{
    margin-top:8px;
    font-size:13px;
    color:var(--text-dim);
  }
  .list{
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--card);
    border-radius:12px;
    padding:10px;
    border:1px solid #33334a;
    transition:background .2s, border-color .2s;
  }
  .item.done{
    background:var(--card-done);
    border-color:var(--accent-dark);
  }
  .num{
    flex:0 0 32px;
    height:32px;
    border-radius:50%;
    background:#3a3a52;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:14px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .item.done .num{
    background:var(--ok);
    color:#0a0a0a;
  }
  .info{
    flex:1;
    min-width:0;
  }
  .label{
    font-size:14px;
    line-height:1.4;
  }
  .thumb-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }
  .thumb-wrap{
    position:relative;
    width:56px;
    height:56px;
  }
  .thumb{
    width:56px;
    height:56px;
    border-radius:8px;
    object-fit:cover;
    border:1px solid var(--accent);
    display:block;
  }
  .thumb-remove{
    position:absolute;
    top:-6px;
    right:-6px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--danger);
    color:#fff;
    border:none;
    font-size:12px;
    line-height:20px;
    text-align:center;
    padding:0;
  }
  .add-tile{
    width:56px;
    height:56px;
    border-radius:8px;
    border:2px dashed #4a4a66;
    background:transparent;
    color:var(--accent);
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(30,30,46,0) 0%, var(--bg) 30%);
  }
  .generate-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#0a0a0a;
    font-size:16px;
    font-weight:700;
  }
  .generate-btn:disabled{
    background:#3a3a52;
    color:var(--text-dim);
  }
  input[type=file]{display:none;}
  .toast{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ok);
    color:#0a0a0a;
    padding:10px 18px;
    border-radius:20px;
    font-size:14px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
    z-index:100;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>📷 商品照片收集 → 自動產生 Word</h1>
  <div class="version-tag" id="versionTag">裕品 載入中...</div>
  <input class="product-input" id="productName" placeholder="商品名稱（會用在檔名與標題，選填）">
  <div class="progress" id="progress">已拍 0 / 17 項</div>
</header>

<div class="list" id="list"></div>

<div class="footer">
  <button class="generate-btn" id="genBtn" disabled onclick="generateDoc()">產生 Word 文件</button>
</div>

<div class="toast" id="toast"></div>

<script>
const TOOL_VERSION = 'v2026.08.17 08:19';
const ITEMS = [
  "外箱正面(外箱長面)（請將外箱上蓋向下折好再拍）",
  "外箱45度角（要拍到箱上蓋與箱長面與箱側邊資訊）",
  "外箱右下角距底部店碼留白",
  "外箱右下角距側邊店碼留白",
  "整箱箱入數",
  "中包裝包裝正面",
  "中包裝條碼近照",
  "中包裝背面（中包裝透明袋單品國際條碼須朝外可清楚辨識）",
  "中包裝入數",
  "單品正面",
  "單品背面",
  "單品品名、規格、保存期限、有效日期、生產地",
  "單品條碼近照",
  "外箱實際量測尺寸照",
  "中包裝實際量測尺寸照（低溫品項無中包裝）",
  "單品實際量測尺寸照",
  "國外生產的商品請另行附上進口報關單"
];

// in-memory only (no browser storage) — resets if page is closed
// photos[idx] = [{dataUrl, landscape}, ...]  (multiple photos allowed per item)
const photos = {};

const listEl = document.getElementById('list');
const genBtn = document.getElementById('genBtn');
const progressEl = document.getElementById('progress');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1500);
}

function buildList(){
  listEl.innerHTML = '';
  ITEMS.forEach((label, idx) => {
    const row = document.createElement('div');
    row.className = 'item';
    row.id = 'item-' + idx;
    row.innerHTML = `
      <div class="num">${idx+1}</div>
      <div class="info">
        <div class="label">${label}</div>
        <div class="thumb-row" id="thumbs-${idx}"></div>
      </div>
      <input type="file" accept="image/*" capture="environment" id="file-${idx}" onchange="handleFile(${idx}, event)">
    `;
    listEl.appendChild(row);
    renderThumbs(idx);
  });
}

function triggerCapture(idx){
  document.getElementById('file-' + idx).click();
}

async function handleFile(idx, event){
  const file = event.target.files[0];
  if(!file) return;
  event.target.value = ''; // allow re-selecting immediately for another shot

  try{
    // createImageBitmap with imageOrientation:'from-image' auto-rotates the photo
    // according to its EXIF tag — iPhone photos are otherwise drawn sideways/stretched.
    const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    drawAndStore(idx, bitmap, bitmap.width, bitmap.height);
  } catch(err){
    // Fallback for older browsers without createImageBitmap EXIF support
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => drawAndStore(idx, img, img.width, img.height);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

function drawAndStore(idx, source, srcW, srcH){
  // compress/resize so the resulting Word file stays a reasonable size
  const maxW = 1280;
  const scale = Math.min(1, maxW / srcW);
  const canvas = document.createElement('canvas');
  canvas.width = srcW * scale;
  canvas.height = srcH * scale;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
  const landscape = canvas.width >= canvas.height;
  if(!photos[idx]) photos[idx] = [];
  photos[idx].push({ dataUrl, landscape, pxW: canvas.width, pxH: canvas.height });
  renderThumbs(idx);
  updateProgress();
  showToast('第 ' + (idx+1) + ' 項已新增照片');
}

function removePhoto(idx, i){
  if(!photos[idx]) return;
  photos[idx].splice(i, 1);
  if(photos[idx].length === 0) delete photos[idx];
  renderThumbs(idx);
  updateProgress();
}

function renderThumbs(idx){
  const wrap = document.getElementById('thumbs-' + idx);
  const row = document.getElementById('item-' + idx);
  const list = photos[idx] || [];
  let html = '';
  list.forEach((p, i) => {
    html += `
      <div class="thumb-wrap">
        <img class="thumb" src="${p.dataUrl}">
        <button class="thumb-remove" onclick="removePhoto(${idx}, ${i})">×</button>
      </div>
    `;
  });
  html += `<button class="add-tile" onclick="triggerCapture(${idx})">＋</button>`;
  wrap.innerHTML = html;
  if(list.length > 0){
    row.classList.add('done');
  } else {
    row.classList.remove('done');
  }
}

function updateProgress(){
  const count = Object.keys(photos).filter(k => photos[k] && photos[k].length > 0).length;
  const totalPhotos = Object.values(photos).reduce((s, arr) => s + arr.length, 0);
  progressEl.textContent = `已拍 ${count} / ${ITEMS.length} 項（共 ${totalPhotos} 張）`;
  genBtn.disabled = totalPhotos === 0;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// The original template's first page (checklist of all 17 items) — kept as-is at the top of every generated doc.
function buildInstructionsHtml(){
  let html = `<p style="font-family:'Microsoft JhengHei';font-size:15pt;font-weight:bold;">外箱及內容物照片上傳範例</p>`;
  html += `<p style="font-family:'Microsoft JhengHei';">總共要上傳的照片有下列項目，上傳照片請依下列順序提供：</p>`;
  ITEMS.forEach((label, idx) => {
    html += `<p style="font-family:'Microsoft JhengHei';">(${idx+1}) ${escapeHtml(label)}</p>`;
    if(idx === 1){
      html += `<p style="font-family:'Microsoft JhengHei';">（若外箱上有另一組外箱條碼時，要附上劃粗破壞結構或是貼住錯誤條碼的照片）</p>`;
    }
  });
  html += `<p style="font-family:'Microsoft JhengHei';"><b>請廠商依照此方式與順序上傳。</b></p>`;
  // force a page break so the actual photos start on page 2
  html += `<br clear=all style='page-break-before:always'>`;
  return html;
}

function generateDoc(){
  const name = document.getElementById('productName').value.trim();
  const title = name ? name + ' 照片' : '商品照片';

  let bodyHtml = buildInstructionsHtml();
  bodyHtml += `<h2 style="font-family:'Microsoft JhengHei';">${escapeHtml(title)}</h2>`;

  ITEMS.forEach((label, idx) => {
    const list = photos[idx];
    if(!list || list.length === 0) return; // skip items without a photo
    bodyHtml += `<p style="font-family:'Microsoft JhengHei';font-size:14pt;font-weight:bold;">(${idx+1}) ${escapeHtml(label)}</p>`;
    list.forEach(p => {
      // compute explicit width AND height in inches (never rely on "auto" — Word's HTML
      // import doesn't reliably compute it and can fall back to the raw pixel count as inches).
      const maxWIn = p.landscape ? 5.5 : 3;
      const maxHIn = 7; // safety cap so an unusually tall/wide source photo can't blow up the page
      const ratio = p.pxH / p.pxW;
      let wIn = maxWIn, hIn = maxWIn * ratio;
      if(hIn > maxHIn){
        hIn = maxHIn;
        wIn = maxHIn / ratio;
      }
      wIn = wIn.toFixed(2);
      hIn = hIn.toFixed(2);
      // Word's HTML importer sizes images mainly off the <img> width/height PIXEL attributes,
      // not the CSS style — without these it falls back to the source photo's raw pixel count
      // treated as inches (a 1280px-wide photo would render ~13in wide). Provide both.
      const wPx = Math.round(wIn * 96);
      const hPx = Math.round(hIn * 96);
      bodyHtml += `<p><img width="${wPx}" height="${hPx}" style="width:${wIn}in;height:${hIn}in;" src="${p.dataUrl}"></p>`;
    });
  });

  const html = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:w="urn:schemas-microsoft-com:office:word"
      xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>${escapeHtml(title)}</title>
<!--[if gte mso 9]>
<xml>
<w:WordDocument>
<w:View>Print</w:View>
<w:Zoom>100</w:Zoom>
<w:DoNotOptimizeForBrowser/>
</w:WordDocument>
</xml>
<![endif]-->
</head>
<body>
${bodyHtml}
</body>
</html>`;

  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const fname = (name ? name : '商品照片') + '.doc';

  // iPhone / iPad Safari: Web Share API lets the user save straight to Files,
  // AirDrop, LINE, Mail, etc. — the normal <a download> trick is unreliable on iOS Safari.
  const file = new File([blob], fname, { type: 'application/msword' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: fname })
      .then(() => showToast('已產生，請選擇「儲存至檔案」'))
      .catch(() => { /* user cancelled the share sheet — do nothing */ });
    return;
  }

  // Desktop browsers / Android Chrome: normal download works fine.
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  showToast('已產生：' + fname);
}

document.getElementById('versionTag').textContent = '裕品 ' + TOOL_VERSION;
buildList();
</script>

</body>
</html>
